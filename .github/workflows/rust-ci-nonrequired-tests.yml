name: Rust CI non-required tests

on:
  workflow_call:
    inputs:
      os:
        description: Runner label for the build and its test partitions
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_nonrequired:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: ./rust/otap-dataflow
          cache-bin: false
          save-if: false
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
          sudo rm -rf /usr/local/julia* /usr/local/lib/android /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google /opt/az /usr/local/share/powershell
      - name: Install nextest
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest
      - name: Build and archive tests (Complete)
        if: inputs.os != 'ubuntu-24.04-arm'
        run: cargo nextest archive --locked --workspace --archive-file nextest-archive.tar.zst
        working-directory: ./rust/otap-dataflow
      - name: Build reduced-feature ARM test archive
        if: inputs.os == 'ubuntu-24.04-arm'
        shell: bash
        env:
          # This job repeatedly died with exit 143 while compiling
          # `otel-arrow-dfe`. Instrumented runs showed severe memory pressure:
          # MemAvailable fell from 5.3 to 2.2 GB and swap reached 99% usage,
          # while disk remained around 30%. Disabling debuginfo reduced swap
          # use to about 9 MB and disk use by about 11 GB, and the build
          # completed at the default job concurrency.
          # `nextest archive` builds under the test profile, so TEST_DEBUG is
          # the lever; DEV_DEBUG is defensive cover for any dev-profile step.
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          # Record live resource usage; remove once stability is established.
          (
            while true; do
              echo "[resources] $(date -u +%T)"
              awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
              df -m / "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/rust/otap-dataflow"
              sleep 15
            done
          ) &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT

          cargo nextest archive \
            --locked \
            --no-default-features \
            --features=crypto-ring,jemalloc,azure,aws,azure-monitor,contrib-processors,unsafe-optimizations \
            --workspace --exclude otel-arrow-dfe-validation --exclude benchmarks \
            --archive-file nextest-archive.tar.zst
        working-directory: ./rust/otap-dataflow
      - name: Upload nextest archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-${{ inputs.os }}
          path: ./rust/otap-dataflow/nextest-archive.tar.zst
          retention-days: 1

  test_nonrequired:
    name: test_nonrequired (otap-dataflow, ${{ inputs.os }}, ${{ matrix.partition }})
    needs: build_nonrequired
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Install nextest
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
          sudo rm -rf /usr/local/julia* /usr/local/lib/android /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google /opt/az /usr/local/share/powershell
      - name: Download nextest archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive-${{ inputs.os }}
          path: ./rust/otap-dataflow
      - name: Run tests (partition ${{ matrix.partition }}/3)
        run: cargo nextest run --profile ci --config-file .config/nextest.toml --archive-file nextest-archive.tar.zst --partition count:${{ matrix.partition }}/3
        working-directory: ./rust/otap-dataflow
      - name: Write JUnit artifact metadata
        if: always()
        shell: bash
        env:
          OS_LABEL: ${{ inputs.os }}
          PARTITION: ${{ matrix.partition }}
        run: |
          printf '{"job": "%s", "os": "%s", "partition": "%s", "folder": "otap-dataflow"}\n' "$GITHUB_JOB" "$OS_LABEL" "$PARTITION" \
            > ./rust/otap-dataflow/target/nextest/ci/metadata.json
      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-xml-nonrequired-${{ inputs.os }}-${{ matrix.partition }}
          path: |
            ./rust/otap-dataflow/target/nextest/ci/junit.xml
            ./rust/otap-dataflow/target/nextest/ci/metadata.json
          retention-days: 30
          if-no-files-found: ignore
